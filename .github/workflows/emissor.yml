name: Emissor de ingressos

on:
  push:
    branches: [main]
    paths: [".github/workflows/emissor.yml", "emissor.py", "aviso_teste.flag", "email_teste.flag"]
  repository_dispatch:
    types: [pedido_pago]   # disparado pelo aviso de pedido pago da Nuvemshop (via Apps Script)
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar um ingresso de teste para o e-mail do Ramon"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: emissor
  cancel-in-progress: false

jobs:
  emitir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Emitir ingressos
        env:
          TICKET_SECRET: ${{ secrets.TICKET_SECRET }}
          NUVEMSHOP_TOKEN: ${{ secrets.NUVEMSHOP_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WHATSAPP_FONE: ${{ secrets.WHATSAPP_FONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          TESTE: ${{ inputs.teste }}
        run: python emissor.py
      - name: Guardar pedidos processados
        run: |
          if [ -n "$(git status --porcelain state.json aviso_teste.flag email_teste.flag bloqueados.json)" ]; then
            git config user.name "emissor-hub"
            git config user.email "emissor-hub@users.noreply.github.com"
            git add -A state.json aviso_teste.flag email_teste.flag bloqueados.json
            git commit -m "Pedidos processados"
            git push
          fi
